<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운전면허 학과시험 모의고사</title>
<style>
  :root{
    --bg1:#eef4ff; --bg2:#f5f0ff; --bg3:#fff5f0;
    --card:#ffffff; --text:#293049; --muted:#7c8499;
    --primary:#5b7cfa; --primary2:#8b6cf0; --primary-dark:#4a63d6;
    --danger:#ef6a5f; --danger-bg:#fdeeec; --success:#3cb87a; --success-bg:#e9f9f0;
    --border:#e7eaf5; --radius:20px; --radius-sm:13px;
    --shadow:0 10px 30px -12px rgba(70,80,140,.16), 0 2px 8px rgba(70,80,140,.06);
    --shadow-sm:0 4px 14px -6px rgba(70,80,140,.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;color:var(--text);min-height:100vh;
    background:
      radial-gradient(1100px 500px at -10% -10%, rgba(139,108,240,.10), transparent 55%),
      radial-gradient(900px 500px at 110% 0%, rgba(255,190,150,.14), transparent 55%),
      linear-gradient(180deg, var(--bg1), var(--bg2) 45%, var(--bg3));
    background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Noto Sans SC",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header.topbar{padding:26px 20px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .brand-badge{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:var(--shadow-sm);}
  header.topbar h1{font-size:15.5px;margin:0;color:var(--muted);font-weight:600;letter-spacing:.01em;line-height:1.4;}
  main{flex:1;padding:10px 18px 44px;display:flex;flex-direction:column;gap:16px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:26px 24px;box-shadow:var(--shadow);animation:riseIn .38s cubic-bezier(.22,.9,.35,1) both;}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .center{text-align:center;}
  h2.title{font-size:21px;margin:4px 0 4px;font-weight:800;letter-spacing:-.01em;}
  p.sub{color:var(--muted);font-size:14px;margin:0 0 20px;line-height:1.5;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .grid.single{grid-template-columns:1fr;}
  button.choice{
    display:block;width:100%;padding:17px 14px;font-size:15px;font-weight:700;
    border:1.5px solid var(--border);border-radius:var(--radius-sm);background:#fbfcff;color:var(--text);
    cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease,background .15s ease;
    text-align:center;line-height:1.4;
  }
  button.choice:hover{border-color:var(--primary);background:#f2f5ff;transform:translateY(-2px);box-shadow:var(--shadow-sm);}
  button.choice:active{transform:translateY(0) scale(.98);}
  button.choice small{display:block;color:var(--muted);font-weight:500;font-size:12px;margin-top:4px;}
  .btn{
    display:inline-block;padding:14px 22px;font-size:15px;font-weight:700;border:none;
    border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--primary),var(--primary2));
    color:#fff;cursor:pointer;box-shadow:0 6px 16px -6px rgba(91,124,250,.55);
    transition:transform .15s ease,box-shadow .15s ease,filter .15s ease;
  }
  .btn:hover{filter:brightness(1.06);transform:translateY(-1px);}
  .btn:active{transform:translateY(0) scale(.98);}
  .btn:disabled{background:#c3cae0;box-shadow:none;cursor:not-allowed;filter:none;transform:none;}
  .btn.secondary{background:#eef1f8;color:var(--text);box-shadow:none;}
  .btn.secondary:hover{background:#e5e9f4;}
  .btn.block{display:block;width:100%;text-align:center;}
  .rowbtns{display:flex;gap:10px;margin-top:18px;}
  .rowbtns .btn{flex:1;}
  .progress-wrap{display:flex;flex-direction:column;gap:8px;padding:6px 4px 4px;}
  .progress-toprow{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);}
  .progress-bar{height:6px;border-radius:6px;background:#e4e9f7;overflow:hidden;}
  .progress-bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--primary),var(--primary2));
    transition:width .25s ease;}
  .timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:14.5px;color:var(--primary-dark);
    background:#eef1ff;padding:5px 12px;border-radius:20px;}
  .timer.low{color:#b8382c;background:var(--danger-bg);}
  .qnum{font-weight:800;color:var(--primary);}
  .qtext{font-size:17px;line-height:1.6;margin:8px 0 18px;white-space:pre-wrap;}
  .qimg{max-width:100%;border-radius:14px;border:1px solid var(--border);margin-bottom:16px;display:block;box-shadow:var(--shadow-sm);}
  .opt{
    display:flex;align-items:flex-start;gap:11px;padding:14px 15px;border:1.5px solid var(--border);
    border-radius:var(--radius-sm);margin-bottom:9px;cursor:pointer;font-size:15px;line-height:1.5;background:#fff;
    transition:border-color .15s ease,background .15s ease,transform .1s ease;
  }
  .opt:hover{border-color:#c3cef7;background:#f8faff;}
  .opt.selected{border-color:var(--primary);background:#f0f3ff;box-shadow:0 0 0 3px rgba(91,124,250,.10);}
  .opt input{margin-top:3px;flex-shrink:0;width:17px;height:17px;accent-color:var(--primary);cursor:pointer;}
  .hint{font-size:12.5px;color:var(--primary-dark);margin:-8px 0 14px;background:#eef1ff;display:inline-block;
    padding:6px 11px;border-radius:20px;font-weight:600;}
  .navbar{display:flex;gap:10px;margin-top:10px;}
  .navbar .btn{flex:1;}
  .qgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:16px;}
  .qgrid button{
    aspect-ratio:1;border-radius:9px;border:1.5px solid var(--border);background:#fff;
    font-size:12px;cursor:pointer;color:var(--muted);transition:.15s ease;font-weight:600;
  }
  .qgrid button:hover{border-color:var(--primary);}
  .qgrid button.answered{background:#eef1ff;border-color:var(--primary);color:var(--primary-dark);font-weight:800;}
  .qgrid button.current{outline:2px solid var(--primary);outline-offset:1px;}
  .score-ring{width:150px;height:150px;margin:6px auto 4px;position:relative;display:flex;align-items:center;justify-content:center;}
  .score-ring svg{transform:rotate(-90deg);}
  .score-ring .ring-bg{fill:none;stroke:#eceffb;stroke-width:10;}
  .score-ring .ring-fill{fill:none;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.22,.9,.35,1);}
  .score-ring .ring-fill.pass{stroke:url(#ringGradSuccess);}
  .score-ring .ring-fill.fail{stroke:url(#ringGradDanger);}
  .score-ring-label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
  .result-score{font-size:34px;font-weight:800;margin:0;line-height:1;}
  .result-score small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;}
  .result-pass{font-size:20px;font-weight:800;padding:6px 0 2px;border-radius:10px;margin-bottom:8px;letter-spacing:.02em;}
  .result-pass.pass{color:var(--success);}
  .result-pass.fail{color:var(--danger);}
  .meta-row{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);
    padding:9px 2px;border-bottom:1px dashed var(--border);}
  .meta-row span:last-child{color:var(--text);font-weight:600;}
  .review-item{border-bottom:1px solid var(--border);padding:16px 0;}
  .review-item:last-child{border-bottom:none;}
  .review-item .qtext{font-size:14.5px;margin:4px 0 9px;}
  .review-opt{font-size:13.5px;padding:8px 11px;border-radius:10px;margin-bottom:4px;}
  .review-opt.correct{background:var(--success-bg);color:#177a48;font-weight:700;}
  .review-opt.wrong-pick{background:var(--danger-bg);color:#c23f30;font-weight:700;}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:20px;
    background:#eef1f6;color:var(--muted);margin-left:6px;}
  .tag.ok{background:var(--success-bg);color:#177a48;}
  .tag.no{background:var(--danger-bg);color:#c23f30;}
  .footer-admin{text-align:center;padding:22px;font-size:12px;color:#a7aec2;}
  .footer-admin a{color:#a7aec2;text-decoration:underline;cursor:pointer;}
  .admin-table{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0 18px;
    border-radius:12px;overflow:hidden;border:1px solid var(--border);}
  .admin-table th,.admin-table td{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:9px 8px;text-align:center;}
  .admin-table th:last-child,.admin-table td:last-child{border-right:none;}
  .admin-table tr:last-child td{border-bottom:none;}
  .admin-table th{background:#f4f6fc;font-weight:700;}
  input.pin{width:100%;padding:13px;font-size:16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    margin-bottom:14px;text-align:center;letter-spacing:.3em;background:#fbfcff;}
  input.pin:focus{outline:none;border-color:var(--primary);}
  .lang-note{font-size:12px;color:var(--muted);margin-top:2px;}
  .disabled-choice{opacity:.42;cursor:not-allowed;}
</style>
</head>

  function t(){ return STR[state.lang] || STR.ko; }

  /* ---------------- state ---------------- */

  var state = {
    lang: null,
    license: null,
    gender: null,
    age: null,
    questions: [],      // the 40 drawn questions (shuffled option order too)
    answers: [],         // array of arrays (selected option indices, 1-based) per question
    idx: 0,
    timeLeft: EXAM_SECONDS,
    timerHandle: null,
    submitted: false
  };

  var bankCache = {}; // key: bank+lang -> array of questions

  /* ---------------- utilities ---------------- */

  function el(tag, cls, html){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(html !== undefined) e.innerHTML = html;
    return e;
  }
  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function fmtTime(sec){
    var m = Math.floor(sec/60), s = sec%60;
    return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
  }
  function licenseById(id){
    for(var i=0;i<LICENSES.length;i++) if(LICENSES[i].id===id) return LICENSES[i];
    return null;
  }

  function loadBank(bankKey, lang){
    var cacheKey = bankKey+"_"+lang;
    if(bankCache[cacheKey]) return Promise.resolve(bankCache[cacheKey]);
    var path = (BANK_FILES[bankKey] && BANK_FILES[bankKey][lang]) || (BANK_FILES[bankKey] && BANK_FILES[bankKey]["ko"]);
    return fetch(path).then(function(r){
      if(!r.ok) throw new Error("bank fetch failed: "+path);
      return r.json();
    }).then(function(data){
      bankCache[cacheKey] = data;
      return data;
    });
  }

  /* ---------------- rendering shell ---------------- */

  var main = document.getElementById("main");
  function render(node){
    main.innerHTML = "";
    main.appendChild(node);
  }

  /* ---------------- Screen: language ---------------- */

  function screenLang(){
    var wrap = el("div");
    var card = el("div","card center");
    card.appendChild(el("h2","title","언어를 선택하세요"));
    card.appendChild(el("p","sub","Select your language / 请选择语言 / Chọn ngôn ngữ"));
    var grid = el("div","grid");
    LANGS.forEach(function(l){
      var b = el("button","choice"+(l.ready?"":" disabled-choice"), l.label + (l.ready? "" : "<small>준비 중 (Coming soon)</small>"));
      b.onclick = function(){
        if(!l.ready){
          alert("현재 " + l.label + " 문제는 준비 중입니다. 한국어로 먼저 이용해주세요.\n(" + l.label + " question set is not ready yet — Korean is available now.)");
          return;
        }
        state.lang = l.code;
        document.getElementById("appTitle").textContent = t().appTitle;
        var adminLinkEl = document.getElementById("adminLink");
        if(adminLinkEl) adminLinkEl.textContent = t().adminLink;
        goLicense();
      };
      grid.appendChild(b);
    });
    card.appendChild(grid);
    wrap.appendChild(card);
    render(wrap);
  }

  /* ---------------- Screen: license ---------------- */

  function licenseLabel(lic){
    return lic["label_"+state.lang] || lic.label_ko;
  }
  function pickLang(obj){
    return obj[state.lang] || obj.ko;
  }

  function screenLicense(){
    var wrap = el("div");

  /* ---------------- Screen: age ---------------- */

  function screenAge(){
    var wrap = el("div");

    card.appendChild(el("h2","title",t().ageTitle));
    var grid = el("div","grid");
    AGES.forEach(function(a){

      grid.appendChild(b);
    });
    card.appendChild(grid);
    wrap.appendChild(card);
    render(wrap);

  /* ---------------- Exam flow ---------------- */

  function startExam(){
    var lic = licenseById(state.license);
    var card = el("div","card center");
    card.appendChild(el("h2","title",t().preparing));
    render(card);

    loadBank(lic.bank, state.lang).then(function(bank){
      var pool = shuffle(bank);
      var picked = pool.slice(0, Math.min(EXAM_QUESTION_COUNT, pool.length));
      // shuffle each question's option order, keep answer indices in sync
      state.questions = picked.map(function(q){
        var order = shuffle(q.options.map(function(_,i){return i;}));
        var newOptions = order.map(function(i){return q.options[i];});
        var newAnswer = q.answer.map(function(origIdx){
          // origIdx is 1-based; find its new 1-based position
          return order.indexOf(origIdx-1)+1;
        });
        return {
          id:q.id, question:q.question, options:newOptions, answer:newAnswer,
          explanation:q.explanation, has_image:q.has_image, images:q.images, bank: lic.bank
        };
      });
      state.answers = state.questions.map(function(){return [];});
      state.idx = 0;
      state.timeLeft = EXAM_SECONDS;
      state.submitted = false;
      renderExamScreen();
      startTimer();
    }).catch(function(err){
      var c = el("div","card center");
      c.appendChild(el("h2","title",t().loadFailTitle));
      c.appendChild(el("p","sub", String(err)));
      render(c);
    });
  }

  function startTimer(){
    if(state.timerHandle) clearInterval(state.timerHandle);
    state.timerHandle = setInterval(function(){
      state.timeLeft--;
      var t = document.getElementById("timerDisplay");
      if(t){
        t.textContent = fmtTime(Math.max(0,state.timeLeft));
        t.className = "timer" + (state.timeLeft<=60 ? " low" : "");
      }
      if(state.timeLeft<=0){
        clearInterval(state.timerHandle);
        finishExam();
      }
    },1000);
  }

  function renderExamScreen(){
    var q = state.questions[state.idx];
    var wrap = el("div");

    var progWrap = el("div","progress-wrap");
    var topRow = el("div","progress-toprow");
    topRow.appendChild(el("div","", "<span class='qnum'>"+(state.idx+1)+"</span> / "+state.questions.length+" "+t().questionsUnit));
    topRow.appendChild(el("div","timer"+(state.timeLeft<=60?" low":""), fmtTime(state.timeLeft)));
    topRow.querySelector(".timer") && (topRow.querySelector(".timer").id="timerDisplay");
    progWrap.appendChild(topRow);
    var pct = Math.round(((state.idx+1)/state.questions.length)*100);
    var pbar = el("div","progress-bar");
    var pfill = el("div","progress-bar-fill");
    pfill.style.width = pct+"%";
    pbar.appendChild(pfill);
    progWrap.appendChild(pbar);
    wrap.appendChild(progWrap);

    var card = el("div","card");
    card.appendChild(el("div","", "<span class='qnum'>"+t().questionLabel+" "+(state.idx+1)+"</span>"));
    card.appendChild(el("div","qtext", escapeHtml(q.question)));

    if(q.has_image && q.images && q.images.length){
      q.images.forEach(function(fname){
        var img = el("img","qimg");
        img.src = IMAGE_DIRS[q.bank] + fname;
        img.alt = t().qImgAlt;
        card.appendChild(img);
      });
    }

    var multi = q.answer.length > 1;
    if(multi){
      card.appendChild(el("div","hint", t().selectAllHint(q.answer.length)));
    }

    var selected = state.answers[state.idx];
    q.options.forEach(function(optText, i){
      var optIdx = i+1;
      var row = el("label","opt"+(selected.indexOf(optIdx)>=0?" selected":""));
      var input = document.createElement("input");
      input.type = multi ? "checkbox" : "radio";
      input.name = "opt";
      input.checked = selected.indexOf(optIdx)>=0;
      input.onchange = function(){
        if(multi){
          var pos = selected.indexOf(optIdx);
          if(input.checked){ if(pos<0) selected.push(optIdx); }
          else { if(pos>=0) selected.splice(pos,1); }
        } else {
          state.answers[state.idx] = [optIdx];
        }
        renderExamScreen();
      };
      row.appendChild(input);
      var span = document.createElement("span");
      span.textContent = (i+1)+". "+optText;
      row.appendChild(span);
      card.appendChild(row);
    });

    var nav = el("div","navbar");
    var prevBtn = el("button","btn secondary",t().prev);
    prevBtn.disabled = state.idx===0;
    prevBtn.onclick = function(){ state.idx--; renderExamScreen(); };
    nav.appendChild(prevBtn);

    if(state.idx < state.questions.length-1){
      var nextBtn = el("button","btn",t().next);
      nextBtn.onclick = function(){ state.idx++; renderExamScreen(); };
      nav.appendChild(nextBtn);
    } else {
      var submitBtn = el("button","btn",t().submit);
      submitBtn.onclick = function(){
        var unanswered = state.answers.filter(function(a){return a.length===0;}).length;
        if(unanswered>0){
          if(!confirm(t().confirmUnanswered(unanswered))) return;
        }
        finishExam();
      };
      nav.appendChild(submitBtn);
    }
    card.appendChild(nav);

    // question jump grid
    var qgrid = el("div","qgrid");
    state.questions.forEach(function(_,i){
      var b = document.createElement("button");
      b.textContent = i+1;
      b.className = (state.answers[i].length>0?"answered ":"") + (i===state.idx?"current":"");
      b.onclick = function(){ state.idx=i; renderExamScreen(); };
      qgrid.appendChild(b);
    });
    card.appendChild(qgrid);

    wrap.appendChild(card);
    render(wrap);
  }

  function escapeHtml(s){
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  function isCorrect(q, given){
    if(given.length !== q.answer.length) return false;
    var a = given.slice().sort();
    var b = q.answer.slice().sort();
    for(var i=0;i<a.length;i++) if(a[i]!==b[i]) return false;
    return true;
  }

  function finishExam(){
    if(state.submitted) return;
    state.submitted = true;
    if(state.timerHandle) clearInterval(state.timerHandle);

    var correctCount = 0;
    state.questions.forEach(function(q,i){
      if(isCorrect(q, state.answers[i])) correctCount++;
    });
    var scorePercent = Math.round((correctCount/state.questions.length)*1000)/10; // one decimal
    var lic = licenseById(state.license);
    var pass = scorePercent >= lic.pass;

    submitStats(pass, scorePercent);
    renderResultScreen(correctCount, scorePercent, pass, lic);
  }

  function submitStats(pass, scorePercent){
    try{
      document.getElementById("f_pass").value = pass ? "합격" : "불합격";
      var langLabel = (LANGS.filter(function(l){return l.code===state.lang;})[0]||{}).label_ko || state.lang;
      document.getElementById("f_lang").value = langLabel;
      document.getElementById("f_license").value = licenseById(state.license).label_ko;
      document.getElementById("f_gender").value = state.gender.ko;
      document.getElementById("f_age").value = state.age.ko;
      document.getElementById("f_score").value = scorePercent;
      document.getElementById("statsForm").submit();
    }catch(e){ /* stats submission is best-effort; never block the user's result */ }
  }

  function renderResultScreen(correctCount, scorePercent, pass, lic){
    var wrap = el("div");
    var card = el("div","card center");
    card.appendChild(el("h2","title",t().resultTitle));

    var r = 60, c = 2*Math.PI*r;
    var dash = c * Math.max(0, Math.min(1, scorePercent/100));
    var ring = el("div","score-ring");
    ring.innerHTML =
      "<svg width='150' height='150' viewBox='0 0 150 150'>"+
        "<circle class='ring-bg' cx='75' cy='75' r='"+r+"'/>"+
        "<circle class='ring-fill "+(pass?"pass":"fail")+"' cx='75' cy='75' r='"+r+"' "+
          "stroke-dasharray='"+c.toFixed(1)+"' stroke-dashoffset='"+(c-dash).toFixed(1)+"'/>"+
      "</svg>"+
      "<div class='score-ring-label'><div class='result-score'>"+scorePercent+"<small>"+t().scoreUnit+"</small></div></div>";
    card.appendChild(ring);
    card.appendChild(el("div","result-pass "+(pass?"pass":"fail"), pass ? t().pass : t().fail));

    var meta = el("div","");
    meta.appendChild(el("div","meta-row","<span>"+t().correctCountLabel+"</span><span>"+correctCount+" / "+state.questions.length+"</span>"));
    meta.appendChild(el("div","meta-row","<span>"+t().licenseLabel+"</span><span>"+licenseLabel(lic)+"</span>"));
    meta.appendChild(el("div","meta-row","<span>"+t().passStandardLabel+"</span><span>"+lic.pass+t().standardSuffix+"</span>"));
    card.appendChild(meta);

    var retryBtn = el("button","btn block",t().retry);
    retryBtn.style.marginTop="18px";
    retryBtn.onclick = function(){ resetToStart(); };
    card.appendChild(retryBtn);
    wrap.appendChild(card);

    // review section
    var reviewCard = el("div","card");
    reviewCard.appendChild(el("h2","title",t().reviewTitle));
    state.questions.forEach(function(q,i){
      var given = state.answers[i];
      var correct = isCorrect(q, given);
      var item = el("div","review-item");
      item.appendChild(el("div","","<b>"+t().questionLabel+" "+(i+1)+"</b> <span class='tag "+(correct?"ok":"no")+"'>"+(correct?t().correctTag:t().wrongTag)+"</span>"));
      item.appendChild(el("div","qtext", escapeHtml(q.question)));
      q.options.forEach(function(optText,idx){
        var optIdx = idx+1;
        var cls = "review-opt";
        if(q.answer.indexOf(optIdx)>=0) cls += " correct";
        else if(given.indexOf(optIdx)>=0) cls += " wrong-pick";
        var div = el("div",cls, (idx+1)+". "+escapeHtml(optText));
        item.appendChild(div);
      });
      if(q.explanation){
        item.appendChild(el("div","hint",t().explanationPrefix+escapeHtml(q.explanation)));
      }
      reviewCard.appendChild(item);
    });
    wrap.appendChild(reviewCard);

    render(wrap);
  }

  function resetToStart(){
    state = {lang:null,license:null,gender:null,age:null,questions:[],answers:[],idx:0,
      timeLeft:EXAM_SECONDS,timerHandle:null,submitted:false};
    document.getElementById("appTitle").textContent = "운전면허 학과시험 모의고사 / Driver's License Written Exam";
    var adminLinkEl = document.getElementById("adminLink");
    if(adminLinkEl) adminLinkEl.textContent = STR.ko.adminLink;
    goLang();
  }

    box.appendChild(el("h2","title",t().adminAuthTitle));
    var pin = document.createElement("input");
    pin.type="password"; pin.className="pin"; pin.placeholder=t().pinPlaceholder; pin.maxLength=8;
    box.appendChild(pin);
    var row = el("div","rowbtns");
    var cancel = el("button","btn secondary",t().cancel);
    cancel.onclick = function(){ document.body.removeChild(overlay); };
    var ok = el("button","btn",t().confirm);
    ok.onclick = function(){
      if(pin.value===ADMIN_PIN){ document.body.removeChild(overlay); renderAdminScreen(); }
      else { alert(t().pinWrong); }
    };
    row.appendChild(cancel); row.appendChild(ok);
    box.appendChild(row);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    pin.focus();
  }

  function renderAdminScreen(){
    var wrap = el("div");
    var card = el("div","card");
    card.appendChild(el("h2","title",t().adminTitle));
    card.appendChild(el("p","sub",t().adminSub));
    var open = document.createElement("a");
    open.href = SHEET_URL; open.target = "_blank"; open.rel="noopener";
    open.className = "btn block";
    open.textContent = t().openSheet;
    open.style.marginBottom = "18px";
    card.appendChild(open);

    card.appendChild(el("h2","title",t().standardsTitle));
    var table = document.createElement("table");
    table.className = "admin-table";
    table.innerHTML = "<tr><th>"+t().thLicense+"</th><th>"+t().thBank+"</th><th>"+t().thStandard+"</th></tr>" +
      LICENSES.map(function(l){
        return "<tr><td>"+licenseLabel(l)+"</td><td>"+(l.bank==="AB"?t().bankAB:t().bankMC)+"</td><td>"+l.pass+t().standardSuffix+"</td></tr>";
      }).join("");
    card.appendChild(table);

    card.appendChild(el("p","hint",t().adminNote));

    var back = el("button","btn secondary block",t().close);
    back.style.marginTop="10px";
    back.onclick = function(){ resetToStart(); };
    card.appendChild(back);

    wrap.appendChild(card);
    render(wrap);
  }

  /* ---------------- boot ---------------- */
  renderFooter();
  goLang();

})();
</script>
</body>
</html>
